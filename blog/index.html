<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drew Williams — Blog</title>
<meta name="description" content="Writing from Drew Williams.">
<meta property="og:title" content="Drew Williams — Blog">
<meta property="og:description" content="Writing from Drew Williams.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://drewhwilliams.com/blog/">
<link rel="canonical" href="https://drewhwilliams.com/blog/">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
<style>
@font-face{font-family:Inter;src:url('/assets/fonts/Inter-Variable.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light;--paper:#fff;--ink:#263b33;--muted:#5a635d;--line:#d7dbd0;--accent:#5e7b51}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100% - 40px,600px);margin:0 auto;padding:44px 0 30px}
a{color:inherit}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.eyebrow{margin:0;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:1.4px;text-transform:uppercase}
footer{text-align:center;font-size:11px;letter-spacing:1.4px;color:var(--muted);margin-top:34px}
footer a{text-decoration:none}
footer a:hover{text-decoration:underline}
footer:before{content:'';display:block;width:26px;height:1px;background:#a8b39f;margin:0 auto 20px}
header{text-align:center}
.portrait{width:88px;height:88px;margin:0 auto 12px;border-radius:50%;background:#dee3d6;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:58% 35%}
h1{font-weight:900;font-size:32px;letter-spacing:-.6px;margin:0 0 10px}
.posts{display:grid;gap:12px;margin-top:28px}
.post{display:block;padding:22px 24px;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:transform .18s,border-color .18s}
.post:hover{transform:translateY(-2px);border-color:#85967e}
.post time{display:block;font-size:12px;color:var(--muted)}
.post strong{display:block;margin-top:6px;font-size:21px;font-weight:750;letter-spacing:-.3px;line-height:1.25}
.post span{display:block;margin-top:8px;font-size:15px;line-height:1.6;color:#56605a}
.message{margin-top:28px;padding:27px 24px;border:1px solid var(--line);border-radius:12px;text-align:center}
.message h2{margin:10px 0 0;font-size:22px;letter-spacing:-.3px;font-weight:750}
.message p:last-child{margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:310px}
.back{display:grid;place-items:center;margin-top:14px;min-height:58px;padding:16px 20px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:14px;font-weight:650;transition:transform .18s,border-color .18s}
.back:hover{transform:translateY(-2px);border-color:#85967e}
@media(max-width:480px){main{padding-top:30px}.post{padding:19px}}
@media(prefers-reduced-motion:reduce){.post,.back{transition:none}}
</style>
</head>
<body><main>
<header><div class="portrait"><img src="/assets/headshot-672.jpg" alt="Drew Williams" width="88" height="88" fetchpriority="high"></div><h1>Drew Williams</h1><p class="eyebrow">The blog</p></header>
<div class="posts">

</div>
<section class="message" data-empty aria-labelledby="blog-status">
<p class="eyebrow">The blog</p>
<h2 id="blog-status">Coming soon</h2>
<p>I’m working on something worth sharing. Check back soon.</p>
</section>
<a class="back" href="/directory/">Back to all links</a>
<footer><a href="https://drewhwilliams.com">DREWHWILLIAMS.COM</a></footer>
</main></body>
</html>
