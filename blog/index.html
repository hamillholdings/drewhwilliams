<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drew Williams — Blog</title>
<meta name="description" content="Drew Williams’s blog is coming soon.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@font-face{font-family:Inter;src:url('/assets/fonts/Inter-Variable.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light;--paper:#fff;--ink:#263b33;--muted:#6b746d;--line:#d7dbd0;--accent:#5e7b51}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100% - 40px,480px);margin:0 auto;padding:44px 0 30px;text-align:center}
.portrait{width:112px;height:112px;display:grid;place-items:center;margin:0 auto 12px;border-radius:50%;background:#dee3d6;border:3px solid var(--ink);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:58% 35%}
h1{font-weight:900;font-size:32px;letter-spacing:-.6px;margin:0}
.message{margin-top:28px;padding:27px 24px;border:1px solid var(--line);border-radius:12px;background:#fff}
.eyebrow{margin:0 0 10px;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:1.4px;text-transform:uppercase}
h2{margin:0;font-size:22px;letter-spacing:-.3px;font-weight:750}
.message-copy{margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:310px}
.back{display:grid;place-items:center;margin-top:14px;min-height:58px;padding:16px 20px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;font-size:14px;font-weight:650;transition:transform .18s,border-color .18s}
.back:hover{transform:translateY(-2px);border-color:#85967e}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{text-align:center;font-size:10px;letter-spacing:1.4px;color:var(--muted);margin-top:34px}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
footer:before{content:'';display:block;width:26px;height:1px;background:#a8b39f;margin:0 auto 20px}
@media(max-width:480px){main{padding-top:30px}.message{padding:24px 19px}}
@media(prefers-reduced-motion:reduce){.back{transition:none}}
</style>
</head>
<body><main>
<header><div class="portrait"><img src="/assets/headshot.jpg" alt="Drew Williams" width="112" height="112" fetchpriority="high"></div><h1>Drew Williams</h1></header>
<section class="message" aria-labelledby="blog-status">
<p class="eyebrow">The blog</p>
<h2 id="blog-status">Coming soon</h2>
<p class="message-copy">I’m working on something worth sharing. Check back soon.</p>
</section>
<a class="back" href="/directory/">Back to all links</a>
<footer><a href="https://drewhwilliams.com">DREWHWILLIAMS.COM</a></footer>
</main></body>
</html>
