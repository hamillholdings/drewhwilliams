<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drew Williams — Links</title>
<meta name="description" content="Get in touch with Drew Williams and find him on YouTube, Instagram, TikTok, and X.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
@font-face{font-family:Inter;src:url('/assets/fonts/Inter-Variable.ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
@font-face{font-family:'Apple Garamond';src:url('/assets/fonts/AppleGaramond-LightItalic.ttf') format('truetype');font-style:italic;font-weight:300;font-display:swap}
:root{color-scheme:light;--paper:#fff;--ink:#263b33;--muted:#6b746d;--line:#d7dbd0;--accent:#5e7b51}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100% - 40px,480px);margin:0 auto;padding:44px 0 30px}
header{text-align:center}
.portrait{width:112px;height:112px;display:grid;place-items:center;margin:0 auto 12px;border-radius:50%;background:#dee3d6;border:3px solid var(--line);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:58% 35%}
h1{font-weight:900;font-size:32px;letter-spacing:-.6px;margin:0}
.contact{margin-top:24px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.contact-toggle{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:16px;list-style:none;cursor:pointer;text-align:center;padding:16px 20px;font-size:15px;font-weight:650;transition:background .18s}
.contact-toggle::-webkit-details-marker{display:none}
.contact-title{display:block}
.contact-subtext{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:400}
.contact-toggle:hover{background:#f8f9f6}
.contact-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.contact-icon{display:grid;place-items:center;width:30px;height:30px;transform:translateX(-3px)}
.contact-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.contact-content{padding:0 20px 20px}
.contact h2{font-size:18px;text-align:center;margin:0 0 6px}
.fields{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:650}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:11px 12px}
.field textarea{min-height:96px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:3px solid #5e7b5155;border-color:var(--accent)}
.turnstile{min-height:65px;display:grid;place-items:center;overflow:hidden}
.turnstile-note{margin:0;color:var(--muted);font-size:12px;text-align:center}
.submit{width:100%;border:0;border-radius:8px;padding:13px 16px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:650;cursor:pointer;transition:background .18s,transform .18s}
.submit:hover{background:#38564a;transform:translateY(-1px)}
.submit:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.submit:disabled{opacity:.65;cursor:wait;transform:none}
.status{min-height:1.4em;margin:0;text-align:center;color:var(--muted);font-size:12px;line-height:1.45}
.status[data-state="error"]{color:#9b332b}
.status[data-state="success"]{color:#385f38}
.trap{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.links-divider{height:1px;border:0;background:var(--line);margin:20px 0}.links{display:grid;gap:11px;margin-top:0}
.link{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:16px;text-align:center;padding:18px 20px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;background:#fff;transition:transform .18s,border-color .18s}
.link:hover{transform:translateY(-2px);border-color:#85967e}
.link:focus-visible,footer a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.icon{display:grid;place-items:center;width:30px;height:30px;flex-shrink:0}
.icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:15px;font-weight:600;display:block}
.handle{display:block;color:var(--muted);font-size:12px;margin-top:5px}
footer{text-align:center;font-size:10px;letter-spacing:1.4px;color:var(--muted);margin-top:34px}
footer a{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
footer:before{content:'';display:block;width:26px;height:1px;background:#a8b39f;margin:0 auto 20px}
@media(max-width:480px){main{padding-top:30px}.contact-content{padding:0 17px 17px}.link{padding:17px 16px}}
@media(prefers-reduced-motion:reduce){.link,.submit{transition:none}}
</style>
</head>
<body><main>
<header><div class="portrait"><img src="/assets/headshot.jpg" alt="Drew Williams" width="112" height="112" fetchpriority="high"></div><h1>Drew Williams</h1></header>

<details class="contact">
  <summary class="contact-toggle"><span class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><span class="contact-title">Get in touch<span class="contact-subtext">Send me a message!</span></span><span aria-hidden="true"></span></summary>
  <div class="contact-content">
  <form id="contact-form" action="/api/contact" method="post">
    <div class="fields">
      <div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required></div>
      <div class="field"><label for="contact-phone">Phone number</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required></div>
      <div class="field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" maxlength="5000" required></textarea></div>
      <div class="trap" aria-hidden="true"><label for="contact-website">Leave this field empty</label><input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <div class="turnstile"><div id="turnstile-widget"></div><p class="turnstile-note" id="turnstile-note"></p></div>
      <button class="submit" type="submit">Send message</button>
      <p class="status" id="contact-status" role="status" aria-live="polite"></p>
    </div>
  </form>
  </div>
</details>

<div class="links-divider" aria-hidden="true"></div>
<nav class="links" aria-label="Social media and website links">
<a class="link" href="https://youtube.com/@drew.hwilliams"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></span><span><span class="label">YouTube</span><span class="handle">@drew.hwilliams</span></span></a>
<a class="link" href="https://www.instagram.com/drew.hwilliams/"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></span><span><span class="label">Instagram</span><span class="handle">@drew.hwilliams</span></span></a>
<a class="link" href="https://www.tiktok.com/@drew.hwilliams"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v12.5a4.5 4.5 0 1 1-4-4.47M14 3c.5 3 2.5 5 6 5"/></svg></span><span><span class="label">TikTok</span><span class="handle">@drew.hwilliams</span></span></a>
<a class="link" href="https://drewhwilliams.com/blog"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span><span><span class="label">Blog</span><span class="handle">drewhwilliams.com/blog</span></span></a>
<a class="link" href="https://x.com/drew_hwilliams"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 3 12 18h4L8 3ZM4 21l7-8M13 11l7-8"/></svg></span><span><span class="label">X</span><span class="handle">@drew_hwilliams</span></span></a>
<a class="link" href="https://www.facebook.com/profile.php?id=61595912796269"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 21v-8h3l.5-3H14V8c0-1 .3-1.7 1.8-1.7H17V3.5c-.3 0-1.4-.2-2.7-.2-2.7 0-4.5 1.7-4.5 4.7V10H7v3h2.8v8Z"/></svg></span><span><span class="label">Facebook</span><span class="handle">id: 61595912796269</span></span></a>
</nav>
<footer><a href="https://drewhwilliams.com">DREWHWILLIAMS.COM</a></footer>
<script>
const form=document.querySelector('#contact-form');
const status=document.querySelector('#contact-status');
const submit=form.querySelector('button[type="submit"]');
const turnstileMount=document.querySelector('#turnstile-widget');
const turnstileNote=document.querySelector('#turnstile-note');
const turnstileSitekey='0x4AAAAAAFrj_VvXhCNEm2Q8';
if(turnstileSitekey.startsWith('REPLACE_')){
  turnstileNote.textContent='Spam protection will appear here before the form is published.';
}else{
  const renderTurnstile=()=>window.turnstile.render(turnstileMount,{sitekey:turnstileSitekey,action:'contact'});
  if(window.turnstile)renderTurnstile();
  else window.addEventListener('load',renderTurnstile,{once:true});
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!form.reportValidity())return;
  status.textContent='Sending…';
  status.dataset.state='';
  submit.disabled=true;
  try{
    const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error(result.message||'Message could not be sent. Please try again.');
    form.reset();
    if(window.turnstile)window.turnstile.reset();
    status.textContent='Thanks — your message has been sent.';
    status.dataset.state='success';
  }catch(error){
    status.textContent=error.message||'Message could not be sent. Please try again.';
    status.dataset.state='error';
    if(window.turnstile)window.turnstile.reset();
  }finally{submit.disabled=false;}
});
</script>
</main></body>
</html>
